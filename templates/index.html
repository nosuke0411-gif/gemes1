<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>YouTube URL 変換ツール</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f7f7f7; }
        body.dark { background: #1e1e1e; color: #f1f1f1; }
        .top-bar { position: fixed; top: 10px; right: 10px; }
        #loginBtn { padding: 8px 14px; font-size: 14px; border-radius: 6px; border: none; background: #28a745; color: white; cursor: pointer; }
        .container { position: relative; text-align: center; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 0 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; }
        body.dark .container { background: #2c2c2c; color: #f1f1f1; }
        #darkBtn { position: absolute; top: 10px; left: 10px; border-radius: 4px; background: #6c757d; color: white; border: none; cursor: pointer; height: 22px; width: 22px; }
        .input-area { display: flex; align-items: center; gap: 6px; }
        input { flex: 9; padding: 14px; font-size: 18px; border-radius: 8px; border: 1px solid #ccc; }
        #clearInputBtn { flex: 1; padding: 6px; font-size: 14px; background: #dc3545; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .action-btn { padding: 14px 20px; font-size: 18px; margin-top: 15px; border: none; border-radius: 8px; cursor: pointer; width: 100%; }
        #convertBtn { background: #007bff; color: white; }
        #playlistBtn { background: #ff9800; color: white; }
        #openBtn { background: #28a745; color: white; display: none; }
        #status { margin-top: 20px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

<div class="top-bar">
    {% if current_user.is_authenticated %}
        <button id="loginBtn" onclick="location.href='/games'">ゲームへ</button>
    {% else %}
        <button id="loginBtn" onclick="location.href='/login'">ログイン</button>
    {% endif %}
</div>

<div class="container">
    <button id="darkBtn" onclick="toggleDark()">🌙</button>
    <h1>YouTube URL 変換ツール</h1>
    <div class="input-area">
        <input id="urlInput" type="text" placeholder="URLを入力">
        <button id="clearInputBtn" onclick="clearInput()">✖️</button>
    </div>
    <button id="convertBtn" class="action-btn" onclick="convert()">変換する</button>
    <button id="playlistBtn" class="action-btn" onclick="playlistAuto()">プレイリスト再生</button>
    <button id="openBtn" class="action-btn" onclick="openUrl()">開く</button>
    <p id="status"></p>
</div>

<script>
    async function convert() {
        const url = document.getElementById("urlInput").value;
        const res = await fetch("/convert", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({url})
        });
        const data = await res.json();
        if (data.success) {
            window.convertedUrl = data.converted;
            document.getElementById("status").innerText = "Connection successful";
            document.getElementById("openBtn").style.display = "block";
        } else {
            document.getElementById("status").innerText = "Error: " + data.error;
            document.getElementById("openBtn").style.display = "none";
        }
    }

    function openUrl() {
        if (window.convertedUrl) window.open(window.convertedUrl, "_blank");
    }

    async function playlistAuto() {
        const url = document.getElementById("urlInput").value;
        const res = await fetch("/playlist_auto", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({url})
        });
        const data = await res.json();
        if (!data.success) {
            document.getElementById("status").innerText = "Error: " + data.error;
            return;
        }
        document.getElementById("status").innerText = "自動再生中…";
        let win = null;
        for (let i = 0; i < data.videos.length; i++) {
            const item = data.videos[i];
            const shortUrl = `https://youtu.be/${item.videoId}`;
            if (i === 0) { win = window.open(shortUrl, "_blank"); }
            else { win.location.href = shortUrl; }
            await new Promise(resolve => setTimeout(resolve, item.duration * 1000));
        }
        document.getElementById("status").innerText = "完了";
    }

    function clearInput() {
        document.getElementById("urlInput").value = "";
        document.getElementById("status").innerText = "";
        document.getElementById("openBtn").style.display = "none";
        window.convertedUrl = null;
    }

    function toggleDark() {
        document.body.classList.toggle("dark");
        const btn = document.getElementById("darkBtn");
        btn.innerText = document.body.classList.contains("dark") ? "☀️" : "🌙";
    }
</script>
</body>
</html>
