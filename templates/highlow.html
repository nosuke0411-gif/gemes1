<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>High & Low</title>
<style>
    body { font-family: sans-serif; background: #f7f7f7; text-align: center; padding-top: 40px; }
    .card { font-size: 50px; background: white; padding: 25px 40px; border-radius: 12px; display: inline-block; margin: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
    .row { display: flex; justify-content: center; align-items: center; gap: 40px; margin-top: 30px; }
    button { padding: 14px; font-size: 20px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; width: 200px; }
    #backBtn { background: #28a745; margin-top: 10px; }
</style>
</head>
<body>

<h2>High & Low</h2>
<p>コイン: {{ coins }}</p>

<div id="game">
    <div class="row">
        <div class="card">{{ suit_emoji }} {{ value }}</div>
        <div class="card">？</div>
    </div>
    <p>
        ベット額:
        <input id="bet" type="number" value="10" min="1" style="width:80px; font-size:18px;">
    </p>
    <button onclick="startGame({{ value }}, '{{ suit }}')">ゲーム開始</button><br>
    <button id="backBtn" onclick="location.href='/games'">ゲーム一覧へ戻る</button>
</div>

<script>
async function startGame(current_value, current_suit) {
    const bet = Number(document.getElementById("bet").value);
    const res = await fetch("/highlow_start", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ current_value, current_suit, bet })
    });
    const data = await res.json();
    document.getElementById("game").innerHTML = data.html;
}

async function play(choice) {
    const res = await fetch("/highlow_play2", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ choice })
    });
    const data = await res.json();
    document.getElementById("game").innerHTML = data.html;
}

function cashout() {
    const btn = document.getElementById('cashout_btn');
    if (btn) btn.disabled = true;
    location.href = '/highlow_cashout';
}
</script>

</body>
</html>
