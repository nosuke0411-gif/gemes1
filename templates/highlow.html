<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>High & Low</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: radial-gradient(circle at center, #1e4d2b 0%, #0a2312 100%);
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .container {
        width: 100%;
        max-width: 600px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 0, 0, 0.4);
        padding: 12px 20px;
        border-radius: 12px;
        border: 1px solid rgba(255, 215, 0, 0.3);
    }
    .top-bar h2 {
        margin: 0;
        font-size: 22px;
    }
    .coin-badge {
        font-size: 18px;
        font-weight: bold;
        color: #ffd700;
    }

    .table-board {
        background: rgba(0, 0, 0, 0.25);
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
    }

    .hand-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: 100%;
    }
    .section-title {
        font-size: 16px;
        color: #a0d8b3;
        font-weight: 600;
    }

    .cards-row {
        display: flex;
        justify-content: center;
        gap: 20px;
        min-height: 100px;
        align-items: center;
    }

    .card {
        background: #ffffff;
        color: #111111;
        padding: 16px 22px;
        border-radius: 10px;
        font-size: 26px;
        font-weight: bold;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        min-width: 80px;
        text-align: center;
        animation: popIn 0.25s ease-out;
    }
    .card.hidden-card {
        background: #2b3e50;
        color: #ffffff;
        border: 2px solid #34495e;
    }
    .card.win-card {
        border: 3px solid #2ecc71;
        box-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
    }
    .card.lose-card {
        border: 3px solid #e74c3c;
        box-shadow: 0 0 15px rgba(231, 76, 60, 0.6);
    }

    @keyframes popIn {
        from { transform: scale(0.7); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    .multiplier-badge {
        font-size: 18px;
        font-weight: bold;
        color: #00f5d4;
        background: rgba(0, 0, 0, 0.4);
        padding: 8px 16px;
        border-radius: 20px;
        border: 1px solid rgba(0, 245, 212, 0.3);
    }
    .multiplier-badge span {
        color: #ffd700;
        font-size: 20px;
    }
    .lose-text {
        color: #e74c3c;
        border-color: rgba(231, 76, 60, 0.3);
    }

    .controls {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        width: 100%;
    }

    .bet-area {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: center;
        width: 100%;
    }
    input[type="number"] {
        padding: 10px;
        font-size: 18px;
        width: 110px;
        border-radius: 8px;
        border: 1px solid #444;
        background: #111;
        color: #fff;
        text-align: center;
    }

    .btn {
        padding: 12px 24px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        transition: transform 0.1s, opacity 0.2s;
        width: 100%;
        max-width: 280px;
    }
    .btn:active { transform: scale(0.96); }
    .btn-start { background: #ffd700; color: #111; }
    .btn-high { background: #e74c3c; color: #fff; flex: 1; max-width: 135px; }
    .btn-low { background: #3498db; color: #fff; flex: 1; max-width: 135px; }
    .btn-cashout { background: #2ecc71; color: #111; }
    .btn-back { background: #555555; color: #fff; margin-top: 6px; }

    .action-row {
        display: flex;
        gap: 12px;
        width: 100%;
        justify-content: center;
        max-width: 280px;
    }

    .result-banner {
        font-size: 18px;
        font-weight: bold;
        text-align: center;
        padding: 12px 16px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.6);
        color: #ffd700;
        min-height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
    }
</style>
</head>
<body>

<div class="container" id="game">
    <div class="top-bar">
        <h2>High & Low</h2>
        <div class="coin-badge">💰 <span>{{ coins }}</span> コイン</div>
    </div>

    <div class="table-board">
        <div class="hand-section">
            <div class="section-title">最初のカード</div>
            <div class="cards-row">
                <div class="card">{{ suit_emoji }} {{ value }}</div>
                <div class="card hidden-card">❓</div>
            </div>
        </div>
    </div>

    <div class="result-banner">ベット額を設定して「ゲーム開始」を押してください</div>

    <div class="controls">
        <div class="bet-area">
            <span>ベット額:</span>
            <input id="bet" type="number" value="10" min="1" max="{{ coins }}">
        </div>
        <button class="btn btn-start" onclick="startGame({{ value }}, '{{ suit }}')">ゲーム開始</button>
        <button class="btn btn-back" onclick="location.href='/games'">ゲーム一覧へ戻る</button>
    </div>
</div>

<script>
async function startGame(current_value, current_suit) {
    const bet = Number(document.getElementById("bet").value);
    if (!bet || bet <= 0) {
        alert("正しいベット額を入力してください");
        return;
    }

    const res = await fetch("/highlow_start", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ current_value, current_suit, bet })
    });
    const data = await res.json();
    document.getElementById("game").innerHTML = data.html;
}

async function play(choice) {
    const res = await fetch("/highlow_play2", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ choice })
    });
    const data = await res.json();
    document.getElementById("game").innerHTML = data.html;
}

function cashout() {
    const btn = document.getElementById('cashout_btn');
    if (btn) btn.disabled = true;
    location.href = '/highlow_cashout';
}
</script>

</body>
</html>
